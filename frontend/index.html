<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarnox Stock Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar-item:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        .sidebar-item.active {
            background-color: rgba(59, 130, 246, 0.2);
            border-right: 4px solid #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-6 border-b border-gray-200">
                <h1 class="text-xl font-bold text-blue-600 flex items-center">
                    <i class="fas fa-chart-line mr-2"></i> Jarnox Stock
                </h1>
            </div>
            <div class="flex-1 overflow-y-auto p-4" id="companyList">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Companies</h2>
                <div id="companiesContainer" class="space-y-1">
                    <!-- Companies will be loaded here -->
                    <div class="animate-pulse space-y-2">
                        <div class="h-10 bg-gray-200 rounded"></div>
                        <div class="h-10 bg-gray-200 rounded"></div>
                        <div class="h-10 bg-gray-200 rounded"></div>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200">
                <button id="compareBtn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200 flex items-center justify-center">
                    <i class="fas fa-exchange-alt mr-2"></i> Compare Stocks
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
            <div id="dashboardHeader" class="mb-8">
                <h2 id="selectedCompanyName" class="text-3xl font-bold text-gray-800">Select a company</h2>
                <p id="selectedCompanySymbol" class="text-gray-500">Choose from the list on the left to see detailed analysis</p>
            </div>

            <!-- Stats Grid -->
            <div id="statsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 hidden">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500 mb-1">Latest Close</p>
                    <h3 id="statClose" class="text-2xl font-bold">--</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500 mb-1">Trend</p>
                    <h3 id="statTrend" class="text-2xl font-bold capitalize">--</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500 mb-1">Volatility</p>
                    <h3 id="statVolatility" class="text-2xl font-bold">--</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500 mb-1">52W Position</p>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                        <div id="stat52wBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                    <p id="stat52wLabel" class="text-xs text-right mt-1 text-gray-500">0%</p>
                </div>
            </div>

            <!-- Chart Card -->
            <div id="chartCard" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8 hidden">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-lg font-semibold">Price History (Last 30 Days)</h3>
                    <div class="flex space-x-2">
                        <span class="px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-xs font-medium">Daily Close</span>
                    </div>
                </div>
                <div class="relative h-80">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>

            <!-- Comparison View (Hidden by default) -->
            <div id="comparisonView" class="hidden space-y-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-semibold mb-4 text-center">Compare Two Companies</h3>
                    <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
                        <select id="compSelect1" class="border rounded-lg p-2 w-full md:w-64"></select>
                        <span class="text-gray-400">VS</span>
                        <select id="compSelect2" class="border rounded-lg p-2 w-full md:w-64"></select>
                        <button id="runComparison" class="bg-blue-600 text-white py-2 px-6 rounded-lg hover:bg-blue-700">Compare</button>
                    </div>
                </div>
                <div id="comparisonResults" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
                    <!-- Comparison cards will be injected here -->
                </div>
            </div>

            <!-- Placeholder -->
            <div id="placeholder" class="flex flex-col items-center justify-center h-64 text-gray-400">
                <i class="fas fa-chart-area text-6xl mb-4"></i>
                <p>Select a company from the sidebar to start analysis</p>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
